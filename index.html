<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #chat { width: 300px; height: 400px; border: 1px solid #ccc; overflow-y: scroll; margin: 20px auto; padding: 10px; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h2>Anonymous Chat</h2>
    <div id="chat"></div>
    <input id="message" type="text" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = Math.random().toString(36).substr(2, 9);
        let roomId = "waiting_room";
        let partnerId = null;

        function findPartner() {
            db.ref("waiting/").once("value", snapshot => {
                let waitingUsers = snapshot.val();
                if (waitingUsers) {
                    for (let key in waitingUsers) {
                        if (key !== userId) {
                            partnerId = key;
                            roomId = `room_${userId}_${partnerId}`;
                            db.ref("waiting/" + key).remove();
                            db.ref("waiting/" + userId).remove();
                            startChat();
                            return;
                        }
                    }
                }
                db.ref("waiting/" + userId).set(true);
            });
        }
        
        function startChat() {
            db.ref("chats/" + roomId).on("child_added", snapshot => {
                let msg = snapshot.val();
                document.getElementById("chat").innerHTML += `<p><strong>${msg.sender}:</strong> ${msg.text}</p>`;
            });
        }

        function sendMessage() {
            let message = document.getElementById("message").value;
            if (message.trim() === "") return;
            db.ref("chats/" + roomId).push({ sender: userId, text: message });
            document.getElementById("message").value = "";
        }

        findPartner();
    </script>
</body>
</html>
